name: Update Homebrew cask

# Called by the release workflow rather than triggered by `release: published`.
# A release created with GITHUB_TOKEN deliberately does not start new workflow
# runs, so an event-driven cask update would silently never fire.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish to the tap
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to the tap (e.g. v0.1.0)
        required: true
        type: string

jobs:
  cask:
    runs-on: ubuntu-latest
    steps:
      # A write deploy key on shkumbinhasani/homebrew-tap. The built-in
      # GITHUB_TOKEN is scoped to this repository and cannot push to another
      # one, and a deploy key is narrower than a personal token: it reaches
      # exactly one repository and is revocable on its own.
      - name: Push the new version to the tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ -z "${TAP_DEPLOY_KEY}" ]; then
            echo "TAP_DEPLOY_KEY is not set — cannot update the cask." >&2
            echo "Add a write deploy key to shkumbinhasani/homebrew-tap and store" >&2
            echo "its private half with: gh secret set TAP_DEPLOY_KEY -R ${GITHUB_REPOSITORY}" >&2
            exit 1
          fi

          VERSION=${TAG#v}
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ReviewPad-macos-universal.zip"
          SHA256=$(curl -fsSL "$URL" | shasum -a 256 | awk '{print $1}')

          # A tag carrying a pre-release suffix goes to its own cask, so testing
          # a beta is one `brew install` rather than a manual unzip — and so it
          # can never be handed to somebody who asked for the stable one.
          if [ "${VERSION}" = "${VERSION#*-}" ]; then
            TOKEN=reviewpad
            NAME='ReviewPad'
            GUARDS='  depends_on macos: :monterey'
          else
            TOKEN='reviewpad@beta'
            NAME='ReviewPad (beta)'
            # Both casks install /Applications/ReviewPad.app and link the same
            # binary, so only one may be present. Homebrew is told rather than
            # left to overwrite: `brew install --cask reviewpad` is how you go
            # back, and it says so instead of silently winning. Stanza order is
            # what `brew style` asks for.
            GUARDS='  conflicts_with cask: "shkumbinhasani/tap/reviewpad"
            depends_on macos: :monterey'
          fi
          echo "${TOKEN} ${VERSION} sha256=${SHA256}"

          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap
          chmod 600 ~/.ssh/tap
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes"

          git clone --depth 1 git@github.com:shkumbinhasani/homebrew-tap.git /tmp/tap
          mkdir -p /tmp/tap/Casks

          cat > "/tmp/tap/Casks/${TOKEN}.rb" <<CASK
          cask "${TOKEN}" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/shkumbinhasani/reviewpad/releases/download/v#{version}/ReviewPad-macos-universal.zip"
            name "${NAME}"
            desc "Local-first Git review app built on GPUI"
            homepage "https://github.com/shkumbinhasani/reviewpad"

          ${GUARDS}

            app "ReviewPad.app"
            binary "#{appdir}/ReviewPad.app/Contents/MacOS/reviewpad"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-cr", "#{appdir}/ReviewPad.app"],
                             sudo: false
            end

            zap trash: [
              "~/Library/Caches/dev.reviewpad.ReviewPad",
              "~/Library/Saved Application State/dev.reviewpad.ReviewPad.savedState",
            ]
          end
          CASK

          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Casks/${TOKEN}.rb"
          if git diff --cached --quiet; then
            echo "cask already up to date"
            exit 0
          fi
          git commit -m "${TOKEN} ${VERSION}"
          git push
