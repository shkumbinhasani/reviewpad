[package]
name = "reviewpad"
version = "0.1.0"
edition = "2024"
description = "A local-first GPUI code review app and agent-friendly CLI"
license = "MIT"

[[bin]]
name = "reviewpad"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
gpui = "=0.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", default-features = false }
tree-sitter = "0.26.12"
tree-sitter-bash = "0.25.1"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-highlight = "0.26.12"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
ureq = { version = "3.4.0", default-features = false, features = ["rustls", "json", "gzip"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = true

