[package]
name = "reviewpad"
version = "0.8.0-rc.3"
edition = "2024"
description = "A local-first GPUI code review app and agent-friendly CLI"
license = "MIT"

[[bin]]
name = "reviewpad"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
core-foundation = "0.10.0"
core-video = { version = "0.4.3", features = ["metal"] }
gpui = "=0.2.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
objc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", default-features = false }
smallvec = "1.15.2"
tree-sitter = "0.26.12"
tree-sitter-bash = "0.25.1"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-highlight = "0.26.12"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
unicode-segmentation = "1.13.3"
ureq = { version = "3.4.0", default-features = false, features = ["rustls", "json", "gzip"] }

# The objc macros expand with a `cargo-clippy` feature cfg, which this crate
# does not declare. Naming it as expected silences the warning at its source
# rather than blanket-allowing the lint.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dev-dependencies]
# Rasterizing the app icon (examples/icon.rs). Same renderer gpui uses for SVGs.
resvg = "0.45"
tempfile = "3.20"
tiny-skia = "0.11"
usvg = "0.45"

[profile.release]
lto = "thin"
strip = true

